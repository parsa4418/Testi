services:
  - type: web
    name: gugu-empire-messenger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/messenger.sqlite3
    disk:
      name: messenger-data
      mountPath: /var/data
      sizeGB: 1
